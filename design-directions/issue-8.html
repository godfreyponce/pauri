<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pauri #8: context-full banner, four shapes</title>
<script>
// Shared data: every variant below reads only this object.
const data = {
  exchanges: [
    {
      question: "Why does my @Observable class not update the view when I change an item in its array?",
      answer: "Changing a property of a struct inside the array does publish a change, because the array itself is replaced. If the items are classes, the array does not change: mark the item class @Observable too, then the row that reads it updates."
    },
    {
      question: "Ok, the items are classes. Do I need @Bindable in the row view?",
      answer: "Only when the row needs a binding, for example a TextField that edits item.title. Reading item.title is enough to observe it. Write `@Bindable var item: Item` in the row and pass `$item.title` to the field."
    },
    {
      question: "Now the list scrolls back to the top every time I type in a row. What causes that?",
      answer: "The ForEach ids change on every edit. You use `id: \\.self` on a type whose hash includes title, so each keystroke makes a new id and SwiftUI rebuilds the list. Use `id: \\.id` with a stable UUID instead."
    }
  ],
  usage: { tokens: 337000, window: 475000 },
  copy: {
    text: "This chat is getting long. Codex may start to lose track of earlier parts.",
    short: "This chat is getting long.",
    handoff: "Write a handoff draft",
    writing: "Writing draft...",
    newChat: "New chat"
  }
};
</script>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 32px; background: #15171c; color: #e8e8ea;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lede { color: #9a9ca3; margin: 0 0 24px; max-width: 900px; }
  .row { display: flex; gap: 28px; overflow-x: auto; padding-bottom: 16px; }
  .col { flex: 0 0 520px; }
  .col h2 { font-size: 14px; margin: 0 0 2px; }
  .col p.note { margin: 0 0 10px; color: #9a9ca3; min-height: 36px; }
  .desk {
    background: linear-gradient(135deg, #2b3a55, #3b2f4a 55%, #1f2c33);
    padding: 0; border-radius: 12px;
  }
  .panel {
    position: relative; width: 520px; height: 680px; box-sizing: border-box;
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
    background: rgba(36, 37, 41, 0.86); backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  .top { display: flex; align-items: center; gap: 12px; min-height: 22px; }
  .top .spacer { flex: 1; }
  .icon { width: 16px; height: 16px; color: #c9c9cc; flex: none; }
  .transcript { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; position: relative; }
  .transcript .fill { flex: 1; }
  .ex .q { font-weight: 700; margin-bottom: 4px; }
  .ex code, .ex .a { white-space: pre-wrap; }
  .input {
    border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25);
    border-radius: 6px; padding: 5px 8px; color: #7e8088;
  }
  button.b {
    font: inherit; font-size: 12px; color: #e8e8ea; cursor: pointer;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 6px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 6px;
  }
  button.b.primary { background: #2f6fde; border-color: #2f6fde; color: #fff; }
  button.b:disabled { opacity: 0.45; cursor: default; }
  button.b.small { font-size: 11px; padding: 2px 7px; }
  .spin {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.35); border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toggle { margin-top: 10px; color: #b9bbc2; display: flex; gap: 6px; align-items: center; }

  /* A: floating card over the top of the transcript */
  .a-card {
    position: absolute; top: 40px; left: 40px; right: 40px; z-index: 2;
    background: rgba(52, 58, 72, 0.92); backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 18px;
    padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .a-card .t { font-weight: 600; margin-bottom: 10px; }
  .a-card .btns { display: flex; gap: 8px; }

  /* B: tray joined to the top edge of the input box */
  .b-wrap .tray {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 196, 64, 0.10); border: 1px solid rgba(255, 196, 64, 0.35);
    border-bottom: none; border-radius: 8px 8px 0 0; padding: 7px 8px;
  }
  .b-wrap .tray .t { flex: 1; color: #e9d8ad; font-size: 12px; }
  .b-wrap .input { border-radius: 0 0 6px 6px; border-color: rgba(255, 196, 64, 0.35); }

  /* C: system row after the last answer, scrolls with the transcript */
  .c-row {
    border-top: 1px solid rgba(255,255,255,0.12); padding-top: 10px; color: #b9bbc2;
    display: flex; flex-direction: column; gap: 8px;
  }
  .c-row .t { display: flex; gap: 6px; align-items: flex-start; }
  .c-row .btns { display: flex; gap: 8px; }

  /* D: header bar, left of the pencil */
  .d-bar { display: flex; align-items: center; gap: 6px; color: #e9d8ad; font-size: 12px; min-width: 0; }
  .d-bar .warn { color: #f0b93a; }
</style>
</head>
<body>
<h1>Context-full banner: four shapes</h1>
<p class="lede">Issue #8. Each mock is the 520 x 680 Pauri panel with the same three exchanges and the
same usage (<span id="usage"></span>). The toggle under a mock shows its "Writing draft..." state, in
which both buttons are off.</p>
<div class="row" id="row"></div>

<script>
const icons = {
  pencil: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="3" width="10" height="11" rx="2"/><path d="M7 9.5l.4-2L13 2l1.6 1.6L9 9.1z"/></svg>',
  gear: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>',
  warn: '<svg class="icon warn" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5l7 12.5H1z" opacity=".9"/><rect x="7.3" y="5.5" width="1.4" height="4.5" fill="#222"/><rect x="7.3" y="11" width="1.4" height="1.4" fill="#222"/></svg>',
  info: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.5"/><path d="M8 7v4.5M8 4.6v.2"/></svg>'
};

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const transcript = () => data.exchanges.map(e =>
  `<div class="ex"><div class="q">${esc(e.question)}</div><div class="a">${esc(e.answer)}</div></div>`).join("");

function buttons(writing, small) {
  const cls = small ? " small" : "";
  const first = writing
    ? `<button class="b primary${cls}" disabled><span class="spin"></span>${data.copy.writing}</button>`
    : `<button class="b primary${cls}">${data.copy.handoff}</button>`;
  return first + `<button class="b${cls}"${writing ? " disabled" : ""}>${data.copy.newChat}</button>`;
}

const topRow = (left = "") => `<div class="top">${left}<span class="spacer"></span>${icons.pencil}${icons.gear}</div>`;
const input = '<div class="input">Ask Pauri</div>';

const variants = [
  {
    name: "A. Floating card",
    note: "A rounded card floats over the top of the transcript, like the ChatGPT retirement banner. Text first, buttons in a row under it.",
    render: w => topRow() +
      `<div class="transcript"><div class="fill"></div>${transcript()}</div>
       <div class="a-card"><div class="t">${data.copy.text}</div><div class="btns">${buttons(w)}</div></div>` + input
  },
  {
    name: "B. Tray on the input box",
    note: "A strip joined to the top edge of the input box: the short text left, buttons right. It sits where the next question is typed.",
    render: w => topRow() +
      `<div class="transcript"><div class="fill"></div>${transcript()}</div>
       <div class="b-wrap"><div class="tray"><span class="t" title="${data.copy.text}">${data.copy.short}</span>${buttons(w, true)}</div>${input}</div>`
  },
  {
    name: "C. Row in the chat",
    note: "A system row after the last answer. It scrolls with the transcript, so it reads as part of the chat rather than over it.",
    render: w => topRow() +
      `<div class="transcript"><div class="fill"></div>${transcript()}
         <div class="c-row"><div class="t">${icons.info}<span>${data.copy.text}</span></div><div class="btns">${buttons(w)}</div></div>
       </div>` + input
  },
  {
    name: "D. Header bar",
    note: "The empty left side of the top row holds a warning icon, the short text, and both buttons as small buttons. The transcript keeps all its room.",
    render: w => topRow(`<div class="d-bar" title="${data.copy.text}">${icons.warn}<span>${data.copy.short}</span>${buttons(w, true)}</div>`) +
      `<div class="transcript"><div class="fill"></div>${transcript()}</div>` + input
  }
];

document.getElementById("usage").textContent =
  `${data.usage.tokens.toLocaleString()} of ${data.usage.window.toLocaleString()} tokens, ` +
  `${Math.round(100 * data.usage.tokens / data.usage.window)}%`;

const row = document.getElementById("row");
variants.forEach((v, i) => {
  const col = document.createElement("div");
  col.className = "col";
  col.innerHTML = `<h2>${v.name}</h2><p class="note">${v.note}</p>
    <div class="desk"><div class="panel" id="p${i}"></div></div>
    <label class="toggle"><input type="checkbox" id="t${i}"> Show "Writing draft..."</label>`;
  row.appendChild(col);
  const panel = col.querySelector(".panel");
  const draw = () => {
    panel.innerHTML = v.render(col.querySelector("input").checked);
    const t = panel.querySelector(".transcript");
    t.scrollTop = t.scrollHeight;
  };
  col.querySelector("input").addEventListener("change", draw);
  draw();
});
</script>
</body>
</html>
